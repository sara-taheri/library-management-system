{% extends "base.html" %}
{% block title %}Log in &middot; Library Management System{% endblock %}
{% block content %}
<div class="auth-card card">
  <h1>Log in</h1>
  <p class="muted">Welcome back! Sign in to manage your borrowing and schedule.</p>

  {% if form_error %}
    <div class="alert alert-error" role="alert">{{ form_error }}</div>
  {% endif %}

  <form method="post" action="/login">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next }}">

    <div class="form-group">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" value="{{ form_username }}" autocomplete="username" required autofocus>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>

    <button class="btn btn-primary btn-block" type="submit">Log in</button>
  </form>

  <p class="muted center">No account yet? <a href="/register">Create one</a> &mdash; it takes seconds.</p>
</div>
{% endblock %}
